name: ChatGPT Web Worker Bootstrap V2 Observer

on:
  push:
    branches:
      - main
    paths:
      - signalguard-rs/phase-2/bootstrap-requests-v2/*.json

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record latest V2 bootstrap run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          request="$(find signalguard-rs/phase-2/bootstrap-requests-v2 -maxdepth 1 -name '*.json' -type f -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          request_id="$(jq -r '.request_id' "$request")"
          for _ in $(seq 1 30); do
            runs="$(gh api repos/${GITHUB_REPOSITORY}/actions/workflows/chatgpt-web-worker-bootstrap-v2.yml/runs -f branch=main -f per_page=20)"
            run="$(printf '%s' "$runs" | jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | first // empty')"
            if [[ -n "$run" ]]; then
              break
            fi
            sleep 2
          done
          test -n "$run"
          result="signalguard-rs/phase-2/bootstrap-observers-v2/${request_id}.json"
          mkdir -p "$(dirname "$result")"
          printf '%s' "$run" | jq --arg request_id "$request_id" '{request_id:$request_id, run_id:.id, status:.status, conclusion:.conclusion, head_sha:.head_sha, html_url:.html_url}' > "$result"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$result"
          git commit -m "bootstrap: observe ${request_id} run"
          git push origin HEAD:main
