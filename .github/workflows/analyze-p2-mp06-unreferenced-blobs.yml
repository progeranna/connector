name: Analyze P2-MP06 Unreferenced Blobs

on:
  push:
    branches: [main]
    paths:
      - signalguard-rs/phase-2/blob-analysis-requests/*.json

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze raw blob bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          request="$(find signalguard-rs/phase-2/blob-analysis-requests -maxdepth 1 -name '*.json' -type f -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          request_id="$(jq -r '.request_id' "$request")"
          expected_sha256="$(jq -r '.expected_sha256' "$request")"
          expected_blob="$(jq -r '.expected_git_blob' "$request")"
          mkdir -p /tmp/blob-analysis
          result="signalguard-rs/phase-2/blob-analysis-results/${request_id}.json"
          mkdir -p "$(dirname "$result")"
          printf '{"request_id":%s,"expected_sha256":%s,"expected_git_blob":%s,"blobs":[' \
            "$(jq -Rn --arg v "$request_id" '$v')" \
            "$(jq -Rn --arg v "$expected_sha256" '$v')" \
            "$(jq -Rn --arg v "$expected_blob" '$v')" > "$result"
          first=1
          while read -r blob; do
            [[ -n "$blob" ]] || continue
            gh api --method GET "repos/progeranna/signalguard-rs/git/blobs/$blob" --jq .content | tr -d '\n' | base64 -d > "/tmp/blob-analysis/$blob.raw"
            raw="/tmp/blob-analysis/$blob.raw"
            size="$(wc -c < "$raw")"
            raw_sha="$(sha256sum "$raw" | awk '{print $1}')"
            raw_git="$(git hash-object --no-filters "$raw")"
            mime="$(file -b "$raw" | sed 's/"/\\"/g')"
            headhex="$(xxd -p -l 32 "$raw" | tr -d '\n')"
            recovered=''
            method='none'
            for enc in UTF-16LE UTF-16BE UTF-32LE UTF-32BE; do
              if iconv -f "$enc" -t UTF-8 "$raw" > "/tmp/blob-analysis/$blob.$enc" 2>/dev/null; then
                candidate="/tmp/blob-analysis/$blob.$enc"
                if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected_sha256" ]] && [[ "$(git hash-object --no-filters "$candidate")" == "$expected_blob" ]]; then
                  recovered="$candidate"
                  method="iconv-$enc"
                  break
                fi
              fi
            done
            if [[ -z "$recovered" ]] && base64 -d "$raw" > "/tmp/blob-analysis/$blob.base64" 2>/dev/null; then
              candidate="/tmp/blob-analysis/$blob.base64"
              if [[ "$(sha256sum "$candidate" | awk '{print $1}')" == "$expected_sha256" ]] && [[ "$(git hash-object --no-filters "$candidate")" == "$expected_blob" ]]; then
                recovered="$candidate"
                method='base64-decode'
              fi
            fi
            if [[ $first -eq 0 ]]; then printf ',' >> "$result"; fi
            first=0
            jq -n \
              --arg blob "$blob" --argjson size "$size" --arg sha256 "$raw_sha" --arg git_blob "$raw_git" \
              --arg file_type "$mime" --arg head_hex "$headhex" --arg recovery_method "$method" \
              --argjson recovered "$([[ -n "$recovered" ]] && echo true || echo false)" \
              '{blob:$blob,size:$size,sha256:$sha256,git_blob:$git_blob,file_type:$file_type,head_hex:$head_hex,recovered:$recovered,recovery_method:$recovery_method}' >> "$result"
          done < <(jq -r '.blobs[]' "$request")
          printf ']}' >> "$result"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$result"
          git commit -m "recovery: analyze ${request_id} unreferenced blobs"
          git push origin HEAD:main
