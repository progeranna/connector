name: ChatGPT Web Worker Bootstrap V2 Status

on:
  workflow_run:
    workflows:
      - ChatGPT Web Worker Bootstrap V2
    types:
      - completed

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record V2 conclusion
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          request="$(find signalguard-rs/phase-2/bootstrap-requests-v2 -maxdepth 1 -name '*.json' -type f -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          request_id="$(jq -r '.request_id' "$request")"
          mini_phase="$(jq -r '.mini_phase' "$request")"
          product_sha="$(jq -r '.product_sha' "$request")"
          product_branch="$(jq -r '.product_branch' "$request")"
          result="signalguard-rs/phase-2/bootstrap-status-v2/${request_id}.json"
          mkdir -p "$(dirname "$result")"
          cat > "$result" <<JSON
          {
            "request_id": "$request_id",
            "mini_phase": "$mini_phase",
            "product_sha": "$product_sha",
            "product_branch": "$product_branch",
            "run_id": $RUN_ID,
            "conclusion": "$CONCLUSION",
            "workflow_head_sha": "$WORKFLOW_HEAD_SHA"
          }
          JSON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$result"
          git commit -m "bootstrap: record ${request_id} staged workflow ${RUN_ID} ${CONCLUSION}"
          git push origin HEAD:main
