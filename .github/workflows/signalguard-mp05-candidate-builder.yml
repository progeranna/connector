name: SignalGuard MP05 Candidate Builder

on:
  push:
    paths:
      - "signalguard-rs/phase-2/candidate-requests/P2-MP05/*.json"

permissions:
  contents: write

jobs:
  build-and-prove:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve candidate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request_file="$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" \
            | grep -E '^signalguard-rs/phase-2/candidate-requests/P2-MP05/.+\.json$' \
            | tail -n 1)"
          test -n "${request_file}"

          product_repository="$(jq -r '.product_repository' "${request_file}")"
          product_sha="$(jq -r '.product_sha' "${request_file}")"
          mini_phase="$(jq -r '.mini_phase' "${request_file}")"
          request_id="$(jq -r '.request_id' "${request_file}")"

          test "${product_repository}" = "progeranna/signalguard-rs"
          test "${mini_phase}" = "P2-MP05"
          [[ "${product_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${request_id}" =~ ^[a-z0-9][a-z0-9._-]*$ ]]

          echo "product_repository=${product_repository}" >> "${GITHUB_OUTPUT}"
          echo "product_sha=${product_sha}" >> "${GITHUB_OUTPUT}"
          echo "request_id=${request_id}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.request.outputs.product_repository }}
          ref: ${{ steps.request.outputs.product_sha }}
          path: product

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: product

      - name: Confirm source commit
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.request.outputs.product_sha }}"
          test -z "$(git status --short)"

      - name: Apply canonical rustfmt
        working-directory: product
        run: cargo fmt --all

      - name: Verify rustfmt scope
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "${changed}" = "src/storage/redis.rs"
          git diff --check
          git diff -- src/storage/redis.rs > ../mp05-rustfmt.patch

      - name: Check formatting
        working-directory: product
        run: cargo fmt --all --check

      - name: Run cargo check
        working-directory: product
        run: cargo check --all-targets --all-features

      - name: Run clippy
        working-directory: product
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run all tests
        working-directory: product
        run: cargo test --all-targets --all-features

      - name: Run existing Redis integration suite
        working-directory: product
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --test redis_cache -- --ignored --test-threads=1

      - name: Run MP05 atomic Redis proof tests
        working-directory: product
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --lib atomic_market_state_write -- --ignored --test-threads=1

      - name: Persist candidate result in connector
        if: always() && steps.request.outcome == 'success'
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          PRODUCT_SHA: ${{ steps.request.outputs.product_sha }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

          output_dir="signalguard-rs/phase-2/candidate-results/P2-MP05/${REQUEST_ID}"
          mkdir -p "${output_dir}"

          formatted_file_present=false
          if test -f product/src/storage/redis.rs; then
            mkdir -p "${output_dir}/src/storage"
            cp product/src/storage/redis.rs "${output_dir}/src/storage/redis.rs"
            formatted_file_present=true
          fi

          if test -f mp05-rustfmt.patch; then
            cp mp05-rustfmt.patch "${output_dir}/mp05-rustfmt.patch"
          fi

          jq -n \
            --arg mini_phase "P2-MP05" \
            --arg request_id "${REQUEST_ID}" \
            --arg product_sha "${PRODUCT_SHA}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            --arg workflow_run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg job_status "${JOB_STATUS}" \
            --argjson formatted_file_present "${formatted_file_present}" \
            '{
              mini_phase: $mini_phase,
              request_id: $request_id,
              product_sha: $product_sha,
              workflow_run_id: $workflow_run_id,
              workflow_run_url: $workflow_run_url,
              job_status: $job_status,
              formatted_file_present: $formatted_file_present
            }' > "${output_dir}/result.json"

          find "${output_dir}" -type f ! -name checksums.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum > "${output_dir}/checksums.sha256"

          git add "${output_dir}"
          git commit -m "ci: record MP05 candidate result ${REQUEST_ID}"
          git push origin HEAD:main
